<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kintor Trading Enterprise</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
  header { background:#1a73e8; color:#fff; padding:20px; text-align:center; }
  nav a { color:#fff; margin:0 15px; text-decoration:none; font-weight:bold; }
  .products { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px; padding:30px; }
  .card { border:1px solid #ddd; border-radius:8px; overflow:hidden; background:#fff; }
  .card img { width:100%; height:180px; object-fit:cover; }
  .card-body { padding:12px; }
  .card-body h3 { font-size:16px; margin-bottom:5px; }
  .price { color:#e67e22; font-weight:bold; }
  .btn { display:block; background:#1a73e8; color:#fff; text-align:center;
         padding:8px; margin-top:10px; text-decoration:none; border-radius:4px; }
  footer { background:#222; color:#ccc; text-align:center; padding:20px; margin-top:30px; }
</style>
</head>
<body>
<header>
  <h1>Kintor Trading Enterprise</h1>
  <nav><a href="#products">Products</a><a href="#checkout">Checkout</a><a href="#contact">Contact</a></nav>
</header>

<section id="products" class="products"></section>

<section id="checkout" style="padding:30px; background:#f5f5f5;">
  <h2>Checkout</h2>
  <p>Cart total: <span id="total">0</span> ETB</p>
  <p><strong>Pay via Telebirr to: 0591263940 (Kintor Trading Enterprise)</strong></p>
  <p>After payment, send your transaction ID via WhatsApp/Telegram to confirm.</p>
</section>

<footer id="contact">
  <p>&copy; 2026 Kintor Trading Enterprise | Phone: 0591263940</p>
</footer>

<script>
// ADD YOUR 70+ PRODUCTS HERE. Replace image URLs with your real product photos.
const products = [
  { name:"Product 1", price:500, img:"https://via.placeholder.com/300x200?text=Product+1" },
  { name:"Product 2", price:750, img:"https://via.placeholder.com/300x200?text=Product+2" },
  { name:"Product 3", price:1200, img:"https://via.placeholder.com/300x200?text=Product+3" },
  // ... continue to 70 products
];
let cart = 0;
const grid = document.querySelector(".products");
products.forEach(p => {
  grid.innerHTML += `
    <div class="card">
      <img src="${p.img}" alt="${p.name}">
      <div class="card-body">
        <h3>${p.name}</h3>
        <span class="price">${p.price} ETB</span>
        <a class="btn" href="#" onclick="addToCart(${p.price});return false;">Add to Cart</a>
      </div>
    </div>`;
});
function addToCart(price){ cart += price; document.getElementById("total").textContent = cart; }
</script>
</body>
</html>
